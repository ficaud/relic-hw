site_name: Relic Hardware
site_description: Build your own Relic device from scratch — a step-by-step guide.
site_url: https://ficaud.github.io/relic-hw/
repo_url: https://github.com/ficaud/relic-hw
repo_name: ficaud/relic-hw
edit_uri: edit/main/docs/
copyright: Relic Hardware is open source — Documentation

theme:
  name: material
  logo: img/relic-logo.png
  favicon: img/relic-logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: black
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: black
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - 1. Setup the Hardware: 1_setup-hardware.md
  - 2. Create Shares: 2_create-shares.md
  - 3. Distribute Shares: 3_distribute-shares.md
#  - 4. Explain Relic: 4_explain-relic.md
  - 4. Recover Your Secret: 4_recover-your-secret.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ficaud/relic-core
      name: relic-core on GitHub

